[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "felops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["ruff", "import-linter", "pytest", "httpx2"]

[tool.hatch.build.targets.wheel]
packages = ["src/felops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.importlinter]
root_package = "felops"

[[tool.importlinter.contracts]]
name = "Orchestrator depends only on ports and domain"
type = "forbidden"
source_modules = ["felops.orchestrator"]
forbidden_modules = ["felops.adapters", "felops.api", "felops.app", "felops.services"]
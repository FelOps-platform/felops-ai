name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev tools
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Architecture contract (import-linter)
        run: lint-imports

      - name: Tests (pytest)
        run: pytest

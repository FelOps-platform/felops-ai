x-tei-common: &tei-common
  command:
    - "--model-id"
    - "${EMBEDDING_MODEL_ID:-BAAI/bge-m3}"
    - "--pooling"
    - "cls"
    - "--auto-truncate"
    # Peak memory during warmup scales with this; 2048 keeps first-run CPU
    # memory low. With --auto-truncate this is also the per-input cap, so long
    # chunks are silently truncated; raise it on GPU/high-RAM hosts.
    - "--max-batch-tokens"
    - "${TEI_MAX_BATCH_TOKENS:-2048}"
  volumes:
    - teidata:/data
  ports:
    - "${TEI_PORT:-8081}:80"
  networks:
    default:
      aliases:
        - tei
  healthcheck:
    test:
      [
        "CMD",
        "bash",
        "-c",
        "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200 OK' <&3",
      ]
    # First run downloads ~2.27 GB of BGE-M3 weights into the teidata volume.
    # 10 min grace + 120 x 10 s retries = up to 30 min.
    interval: 10s
    timeout: 10s
    retries: 120
    start_period: 600s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-felops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-felops_dev}
      POSTGRES_DB: ${POSTGRES_DB:-felops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.0
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200 OK' <&3"]
      interval: 5s
      retries: 10

  mock-mcp:
    build:
      context: .
      dockerfile: mocks/mock_mcp/Dockerfile
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 5s
      retries: 10

  mock-backend:
    build:
      context: .
      dockerfile: mocks/mock_backend/Dockerfile
    environment:
      AI_SERVICE_URL: http://api:8000
      BACKEND_IDENTITY_TOKEN: ${BACKEND_IDENTITY_TOKEN:-dev_backend_token}
      AI_IDENTITY_TOKEN: ${AI_IDENTITY_TOKEN:-dev_ai_token}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-felops}:${POSTGRES_PASSWORD:-felops_dev}@postgres:5432/${POSTGRES_DB:-felops}}
      QDRANT_URL: http://qdrant:6333
      MOCK_MCP_URL: http://mock-mcp:9000
      BACKEND_URL: http://mock-backend:8080
      BACKEND_IDENTITY_TOKEN: ${BACKEND_IDENTITY_TOKEN:-dev_backend_token}
      AI_IDENTITY_TOKEN: ${AI_IDENTITY_TOKEN:-dev_ai_token}
      API_KEY: ${API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      # Hardcoded container-internal URL; .env keeps the host-side
      # http://localhost:8081 for live tests.
      EMBEDDING_URL: http://tei:80
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-BAAI/bge-m3}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mock-mcp:
        condition: service_healthy
      mock-backend:
        condition: service_healthy
      # Only one TEI profile is active at a time. required:false ignores the
      # inactive profile instead of failing with "undefined service"; when
      # active, Compose waits for its healthcheck.
      tei-cpu:
        condition: service_healthy
        required: false
      tei-gpu:
        condition: service_healthy
        required: false
    healthcheck:
      # api is ready only when both its own /health and TEI /health answer.
      # The shared "tei" alias works for either profile.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3); u.urlopen('http://tei:80/health', timeout=3)",
        ]
      interval: 5s
      retries: 30
      start_period: 30s

  tei-cpu:
    <<: *tei-common
    profiles: ["cpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_CPU_TAG:-cpu-1.10}

  tei-gpu:
    <<: *tei-common
    profiles: ["gpu"]
    # 1.10 is the default for server/datacenter Ampere (A100); override
    # TEI_GPU_TAG for RTX 2050/30xx/A10 (86-1.10), Ada (89-1.10), or T4 (turing-1.10).
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_GPU_TAG:-1.10}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # host needs nvidia-container-toolkit
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  qdrantdata:
  teidata:

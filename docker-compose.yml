services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.0
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      retries: 10

  mock-mcp:
    build:
      context: .
      dockerfile: mocks/mock_mcp/Dockerfile
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 5s
      retries: 10

  mock-backend:
    build:
      context: .
      dockerfile: mocks/mock_backend/Dockerfile
    environment:
      AI_SERVICE_URL: http://api:8000
      BACKEND_IDENTITY_TOKEN: ${BACKEND_IDENTITY_TOKEN:-dev_backend_token}
      AI_IDENTITY_TOKEN: ${AI_IDENTITY_TOKEN:-dev_ai_token}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      MOCK_MCP_URL: http://mock-mcp:9000
      BACKEND_URL: http://mock-backend:8080
      BACKEND_IDENTITY_TOKEN: ${BACKEND_IDENTITY_TOKEN:-dev_backend_token}
      AI_IDENTITY_TOKEN: ${AI_IDENTITY_TOKEN:-dev_ai_token}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mock-mcp:
        condition: service_healthy
      mock-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  qdrantdata:
